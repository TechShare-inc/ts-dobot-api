[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ts-dobot-api"
version = "1.0.0-alpha.1"
description = "TechShare Dobot API wrapper"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "dobot-api-v3 @ git+https://github.com/TechShare-inc/TCP-IP-Python-V3.git@a60cc49f66b8668238063d650e90d4e76806dbbb",
    "dobot-api-v4 @ git+https://github.com/TechShare-inc/TCP-IP-Python-V4.git@bd32fad593ac4c3775f5202e0aaaeccddf5d6c94",
    "numpy>=1.20.0",
    "loguru>=0.7.0",
    "python-i18n>=0.3.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.10",
    "ruff>=0.4",
    "mypy>=1.0",
]

[project.urls]
Repository = "https://github.com/TechShare-inc/ts-dobot-api"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = false

[[tool.mypy.overrides]]
module = ["dobot_api_v3.*", "dobot_api_v4.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

# ---------------------------------------------------------------------------
# Pixi environment management
# ---------------------------------------------------------------------------
[tool.pixi.project]
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-64", "osx-arm64"]

[tool.pixi.dependencies]
python = "3.10.*"

# ts-dobot-api[dev] pulls in both the package and all [project.optional-dependencies.dev]
# entries, avoiding duplication. Vendor libraries are pinned to exact git commits.
[tool.pixi.pypi-dependencies]
ts-dobot-api = { path = ".", editable = true, extras = ["dev"] }
dobot-api-v3 = { git = "https://github.com/TechShare-inc/TCP-IP-Python-V3", rev = "a60cc49f66b8668238063d650e90d4e76806dbbb" }
dobot-api-v4 = { git = "https://github.com/TechShare-inc/TCP-IP-Python-V4", rev = "bd32fad593ac4c3775f5202e0aaaeccddf5d6c94" }

[tool.pixi.environments]
default = { solve-group = "default" }

[tool.pixi.tasks]
test = "pytest"
lint = "ruff check src tests"
typecheck = "mypy src"
